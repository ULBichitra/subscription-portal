<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="36" fill="#09090b"/>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Outline -->
  <path d="M 96 28 L 148 48 C 148 100 126 138 96 160 C 66 138 44 100 44 48 Z" 
        fill="url(#shieldGrad)" opacity="0.15"/>
  <path d="M 96 28 L 148 48 C 148 100 126 138 96 160 C 66 138 44 100 44 48 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>
        
  <!-- Clinical Cross inside Shield -->
  <!-- Vertical bar -->
  <rect x="85" y="60" width="22" height="68" rx="6" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <!-- Horizontal bar -->
  <rect x="62" y="83" width="68" height="22" rx="6" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Central Pulse / Telemetry Core Indicator -->
  <circle cx="96" cy="94" r="5" fill="#ffffff"/>
</svg>
