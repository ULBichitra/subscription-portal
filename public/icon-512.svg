<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#09090b"/>
  <defs>
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Outline -->
  <path d="M 256 72 L 396 128 C 396 268 336 370 256 428 C 176 370 116 268 116 128 Z" 
        fill="url(#shieldGrad512)" opacity="0.15"/>
  <path d="M 256 72 L 396 128 C 396 268 336 370 256 428 C 176 370 116 268 116 128 Z" 
        fill="none" stroke="url(#shieldGrad512)" stroke-width="16" stroke-linejoin="round"/>
        
  <!-- Clinical Cross inside Shield -->
  <!-- Vertical bar -->
  <rect x="226" y="160" width="60" height="180" rx="16" fill="url(#shieldGrad512)" filter="url(#glow512)"/>
  <!-- Horizontal bar -->
  <rect x="166" y="220" width="180" height="60" rx="16" fill="url(#shieldGrad512)" filter="url(#glow512)"/>
  
  <!-- Central Pulse / Telemetry Core Indicator -->
  <circle cx="256" cy="250" r="14" fill="#ffffff"/>
</svg>
